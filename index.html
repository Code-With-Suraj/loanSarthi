<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>LoanSarthi — Smart Loan Management Platform</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>
:root {
  --bg:#0f172a;
  --primary:#3b82f6;
  --secondary:#8b5cf6;
  --text:#f8fafc;
  --muted:#94a3b8;
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* SAFE AREA (Mobile Notch Fix) */
body{
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* LOADER */
.loader{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#0f172a,#111827);
  transition:opacity .4s ease,visibility .4s;
}

.loader.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

/* CARD */
.card{
  width:90%;
  max-width:340px;
  padding:28px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(16px);
  text-align:center;
}

/* LOGO */
.logo{
  font-size:28px;
  font-weight:800;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:8px;
}

/* TEXT */
.tagline{
  font-size:12px;
  color:var(--muted);
  margin-bottom:20px;
}

/* SPINNER */
.spinner{
  width:60px;
  height:60px;
  margin:0 auto 20px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,0.1);
  border-top:4px solid var(--primary);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* PROGRESS */
.progress{
  height:6px;
  width:100%;
  border-radius:10px;
  background:rgba(255,255,255,0.1);
  overflow:hidden;
}
.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  transition:width .4s ease;
}

/* IFRAME */
.app{
  width:100%;
  height:100%;
}
iframe{
  width:100%;
  height:100%;
  border:none;
}

/* MOBILE OPTIMIZATION */
@media(max-width:480px){
  .logo{font-size:24px}
  .card{padding:22px}
}

</style>
</head>

<body>

<div class="loader" id="loader">
  <div class="card">
    <div class="logo">LoanSarthi</div>
    <div class="tagline">Track • Manage • Recover</div>
    <div class="spinner"></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>
</div>

<div class="app">
  <iframe 
    id="frame"
    src="https://script.google.com/macros/s/AKfycbz5rO2qSm8s_mFCP7j-eh5d9H8XPO9sxxfzzU2A_WrWgUEj__QCI5tA_27iHmWI0udmZw/exec"
    loading="eager"
    onload="loaded()"
  ></iframe>
</div>

<script>
const loader = document.getElementById("loader");
const bar = document.getElementById("bar");

let progress = 0;

// Fake progress animation (better UX feel)
const interval = setInterval(()=>{
  progress += Math.random()*15;
  if(progress >= 90) progress = 90;
  bar.style.width = progress + "%";
},300);

function loaded(){
  clearInterval(interval);
  bar.style.width = "100%";

  setTimeout(()=>{
    loader.classList.add("hide");
  },500);
}

// fallback
setTimeout(()=>loader.classList.add("hide"),7000);
</script>

</body>
</html>
