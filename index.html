<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#0f172a;
  --primary:#3b82f6;
  --secondary:#8b5cf6;
  --text:#f8fafc;
  --muted:#94a3b8;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
.loader{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#0f172a,#111827);
  transition:opacity .4s ease,visibility .4s;
}
.loader.hide{opacity:0;visibility:hidden;pointer-events:none;}
.card{
  width:90%;
  max-width:340px;
  padding:28px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(16px);
  text-align:center;
}
.logo{
  font-size:28px;
  font-weight:800;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:8px;
}
.tagline{font-size:12px;color:var(--muted);margin-bottom:20px;}
.spinner{
  width:60px;height:60px;margin:0 auto 20px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,0.1);
  border-top:4px solid var(--primary);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:6px;width:100%;border-radius:10px;background:rgba(255,255,255,0.1);overflow:hidden;}
.bar{height:100%;width:0%;background:linear-gradient(90deg,var(--primary),var(--secondary));transition:width .4s ease;}
.app{width:100%;height:100%;}
iframe{width:100%;height:100%;border:none;}
@media(max-width:480px){.logo{font-size:24px}.card{padding:22px}}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="card">
    <div class="logo">LoanSarthi</div>
    <div class="tagline">Track • Manage • Recover</div>
    <div class="spinner"></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>
</div>

<div class="app">
  <iframe 
    id="frame"
    src="https://script.google.com/macros/s/AKfycbzq-ogfwYOkAUEb1Wiv3vOSoAwhHxQsSenSxGNJDCQ99i8SgRmrNKdgElNqsr8QMDYh8w/exec"
    loading="eager"
    onload="loaded()"
  ></iframe>
</div>

<script>
const loader = document.getElementById("loader");
const bar = document.getElementById("bar");
let progress = 0;
const interval = setInterval(()=>{
  progress += Math.random()*12;
  if(progress >= 92) progress = 92;
  bar.style.width = progress + "%";
}, 300);
function loaded(){
  clearInterval(interval);
  bar.style.width = "100%";
  setTimeout(()=>{ loader.classList.add("hide"); }, 500);
}
setTimeout(()=>loader.classList.add("hide"), 7000);
</script>
</body>
